services:
  goboxd:
    build:
      context: .
      target: runtime
    image: goboxd:dev
    container_name: goboxd
    ports:
      - "8080:8080"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined

  tools:
    build:
      context: .
      target: builder
    image: goboxd-tools:dev
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    volumes:
      - .:/src
    working_dir: /src
    profiles: ["tools"]
    entrypoint: []
