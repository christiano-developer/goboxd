services:
  goboxd:
    build:
      context: .
      target: runtime
    image: goboxd:dev
    container_name: goboxd
    ports:
      - "8080:8080"
    # Hard caps: 2 vCPUs of CPU time and 2 GB RAM (honored by `docker compose up`).
    cpus: 2.0
    mem_limit: 2g
    # Pin job concurrency to the CPU cap. The app otherwise defaults to
    # runtime.NumCPU(), which reads the HOST core count, not the cgroup limit.
    environment:
      - CONCURRENCY_LIMIT=16
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined

  tools:
    build:
      context: .
      target: builder
    image: goboxd-tools:dev
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    volumes:
      - .:/src
    working_dir: /src
    profiles: ["tools"]
    entrypoint: []
