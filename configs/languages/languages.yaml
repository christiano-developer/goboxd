# Language registry
#
#
#

languages:
  - id: py3
    name: Python 3
    source_filename: solution.py
    run:
      cmd: /usr/bin/python3
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: c
    name: C
    source_filename: solution.c
    artifact: solution
    build:
      cmd: /usr/bin/gcc
      args: ["{{source}}", "-o", "{{artifact}}", "-std=c11"]
      limits:
        wall_time_s: 15
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-Wall"
        - "-Wextra"
        - "-std=c11"
        - "-std=c99"
    run:
      cmd: "./{{artifact}}"
      limits:
        wall_time_s: 10
        memory_kb: 128000
        max_processes: 32

  - id: cpp
    name: C++
    source_filename: solution.cpp
    artifact: solution
    build:
      cmd: /usr/bin/g++
      args: ["{{source}}", "-o", "{{artifact}}", "-std=c++17"]
      limits:
        wall_time_s: 15
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist:
        - "-O0"
        - "-O1"
        - "-O2"
        - "-O3"
        - "-Wall"
        - "-Wextra"
        - "-std=c++17"
        - "-std=c++20"
    run:
      cmd: "./{{artifact}}"
      limits:
        wall_time_s: 10
        memory_kb: 128000
        max_processes: 32

  - id: java
    name: Java
    source_filename_strategy: from_request
    artifact_filename_strategy: from_request
    build:
      cmd: /usr/bin/javac
      args:
        - "-J-XX:+UseSerialGC"
        - "-J-XX:TieredStopAtLevel=1"
        - "-J-XX:CompressedClassSpaceSize=32m"
        - "-J-Xms128m"
        - "-J-Xmx256m"
        - "{{source}}"
      limits:
        wall_time_s: 15
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: /usr/bin/java
      args:
        - "-XX:+UseSerialGC"
        - "-XX:TieredStopAtLevel=1"
        - "-XX:CompressedClassSpaceSize=32m"
        - "-Xms64m"
        # 384m heap: headroom for java workloads that hold ~150 MB on the heap
        # (the 128m default OOMs them) while staying well under the container's
        # 2 GB cap even at concurrency 2.
        - "-Xmx384m"
        - "{{artifact}}"
      limits:
        wall_time_s: 10
        # 1.5 GB rlimit_as so the JVM's virtual reservation (heap + metaspace +
        # thread stacks) fits at -Xmx384m. Address space, not RSS.
        memory_kb: 1572864
        max_processes: 100

  - id: bash
    name: Bash
    source_filename: solution.sh
    run:
      cmd: /bin/bash
      args: ["{{source}}"]
      limits:
        wall_time_s: 5
        memory_kb: 51200
        max_processes: 32

  - id: js
    name: JavaScript (Node)
    source_filename: solution.js
    run:
      cmd: /usr/bin/node
      args: ["--max-old-space-size=128", "{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 1048576
        max_processes: 64

  - id: php
    name: PHP
    source_filename: solution.php
    run:
      cmd: /usr/bin/php
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 64

  - id: kotlin
    name: Kotlin
    source_filename: solution.kt
    artifact: solution.jar
    build:
      cmd: /usr/local/bin/kotlinc
      # -J flags bound the compiler JVM's virtual reservation so it fits under
      # nsjail's rlimit_as (serial GC + small compressed class space), mirroring javac.
      # NOTE: no -include-runtime — that bundles kotlin-stdlib (~5 MB) into the jar
      # and trips nsjail's 1 MB RLIMIT_FSIZE. We emit a thin jar (~1 KB) and supply
      # the already-installed stdlib on the classpath at run time instead.
      args:
        - "-J-XX:+UseSerialGC"
        - "-J-XX:TieredStopAtLevel=1"
        - "-J-XX:CompressedClassSpaceSize=64m"
        - "-J-Xms128m"
        - "-J-Xmx512m"
        - "{{source}}"
        - "-d"
        - "{{artifact}}"
      limits:
        wall_time_s: 60
        memory_kb: 2097152
        max_processes: 256
    run:
      cmd: /usr/bin/java
      # Thin jar on the classpath alongside the host-installed kotlin-stdlib (read-only,
      # so RLIMIT_FSIZE never applies to it). Main class is <SourceBasename>Kt:
      # solution.kt compiles to SolutionKt.
      args:
        - "-XX:+UseSerialGC"
        - "-XX:TieredStopAtLevel=1"
        - "-XX:CompressedClassSpaceSize=32m"
        - "-Xms64m"
        - "-Xmx256m"
        - "-cp"
        - "{{artifact}}:/opt/kotlinc/lib/kotlin-stdlib.jar"
        - "SolutionKt"
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
    smoke_check_cmd: /usr/local/bin/kotlinc
    smoke_check_args: ["-version"]

  - id: lisp
    name: Common Lisp (SBCL)
    source_filename: solution.lisp
    run:
      cmd: /usr/bin/sbcl
      # --dynamic-space-size bounds SBCL's GC heap reservation so it fits under rlimit_as.
      args: ["--dynamic-space-size", "256", "--script", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 32
    smoke_check_cmd: /usr/bin/sbcl
    smoke_check_args: ["--version"]

  - id: verilog
    name: Verilog
    source_filename: solution.v
    artifact: solution.vvp
    build:
      cmd: /usr/bin/iverilog
      args: ["-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 262144
        max_processes: 32
    run:
      cmd: /usr/bin/vvp
      args: ["{{artifact}}"]
      limits:
        wall_time_s: 5
        memory_kb: 128000
        max_processes: 32
